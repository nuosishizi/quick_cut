name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: ./pack-windows.ps1
          - os: macos-latest
            script: ./pack-macos.ps1
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Setup FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Setup Bun (macOS)
        if: runner.os == 'macOS'
        uses: oven-sh/setup-bun@v2

      - name: Run Test Suite
        shell: pwsh
        run: |
          cd Modules/EditorRuntime/editor-desktop
          node --test tests/alignment-status.test.mjs tests/script-judge.test.mjs tests/resolve-export.test.mjs tests/resolve-link.test.mjs tests/export-captions.test.mjs tests/timeline-edit.test.mjs tests/text-layout.test.mjs tests/ui-regressions.test.mjs tests/punctuation-quotes.test.mjs tests/denoise-isolation.test.mjs

      - name: Package Application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          pwsh -ExecutionPolicy Bypass -File ${{ matrix.script }} -OutDir dist

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifacts
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
